<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #4f46e5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: min(500px, 100%);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    textarea,
    select,
    button {
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
    }

    textarea {
      height: 120px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #ccc;
    }

    .row {
      display: flex;
      gap: 15px;
      margin: 15px 0;
    }

    select {
      width: 50%;
      padding: 10px;
      border: 1px solid #ccc;
    }

    button {
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #3730a3;
    }

    button:disabled {
      background: #a5a2eb;
      cursor: not-allowed;
    }

    .output {
      margin-top: 20px;
    }

    .output textarea {
      background: #f5f5f5;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>🌍 Language Translator</h2>

    <textarea id="inputText" placeholder="Enter text to translate..."></textarea>

    <div class="row">
      <select id="sourceLang">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="hi">Hindi</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh-CN">Chinese</option>
      </select>

      <select id="targetLang">
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh-CN">Chinese</option>
      </select>
    </div>

    <button id="translateButton" onclick="translateText()">Translate</button>

    <div class="output">
      <textarea id="outputText" placeholder="Translation..." readonly></textarea>
    </div>
  </main>

  <script>
    async function translateText() {
      const input = document.getElementById("inputText");
      const output = document.getElementById("outputText");
      const button = document.getElementById("translateButton");

      const text = input.value.trim();
      const source = document.getElementById("sourceLang").value;
      const target = document.getElementById("targetLang").value;

      if (!text) {
        output.value = "Please enter text to translate.";
        return;
      }

      if (source === target) {
        output.value = text;
        return;
      }

      output.value = "Translating...";
      button.disabled = true;
      button.textContent = "Translating...";

      try {
        const url = new URL("https://api.mymemory.translated.net/get");
        url.searchParams.set("q", text);
        url.searchParams.set("langpair", `${source}|${target}`);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        const data = await response.json();
        const translatedText = data.responseData?.translatedText;

        if (!translatedText) {
          throw new Error("The translation service returned no translation.");
        }

        output.value = translatedText;
      } catch (error) {
        console.error(error);
        output.value = "Translation failed. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Translate";
      }
    }
  </script>
</body>
</html>
